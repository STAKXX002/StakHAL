[package]
name = "stakhal-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
stakhal-core = { path = "../stakhal-core" }
gtk4 = { package = "gtk4", version = "0.9", features = ["v4_14"] }
libadwaita = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
sourceview5 = { package = "sourceview5", version = "0.9", features = ["v5_12"] }
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
