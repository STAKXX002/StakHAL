name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GTK4 and Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev xvfb libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Print GTK and libadwaita versions
        run: pkg-config --modversion gtk4 libadwaita-1

      - name: Run stakhal-core tests
        run: cargo test -p stakhal-core

      - name: Run stakhal-ui tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo test -p stakhal-ui --no-fail-fast -- --test-threads=1 --nocapture
        env:
          GDK_BACKEND: x11

      - name: Upload rendered window artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-windows
          path: target/tmp/**/*.png
          if-no-files-found: ignore
