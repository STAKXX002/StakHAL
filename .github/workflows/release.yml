name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Debian Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GTK4 and Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            dpkg-dev \
            binutils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep -m 1 '^version =' stakhal-ui/Cargo.toml | cut -d '"' -f 2)
            TAG_VER="v${RAW_VER}"
          fi
          echo "tag=${TAG_VER}" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: ${TAG_VER}"

      - name: Build Debian Package
        run: |
          chmod +x packaging/build_deb.sh
          ./packaging/build_deb.sh "${{ steps.version.outputs.tag }}"
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: StakHAL ${{ steps.version.outputs.tag }}
          files: dist/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
