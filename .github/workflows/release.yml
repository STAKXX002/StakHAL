name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Debian Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GTK4, Xvfb, and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev xvfb dpkg-dev libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo.toml version matches git tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          TAG_VERSION="${TAG_NAME#v}"
          CARGO_VERSION=$(grep -m 1 '^version =' stakhal-ui/Cargo.toml | cut -d '"' -f 2)

          echo "Git tag: ${TAG_NAME} (parsed version: ${TAG_VERSION})"
          echo "Cargo.toml version: ${CARGO_VERSION}"

          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Version mismatch! Git tag is '${TAG_NAME}' (${TAG_VERSION}), but stakhal-ui/Cargo.toml specifies version '${CARGO_VERSION}'."
            echo "Please update stakhal-ui/Cargo.toml to match the release tag before publishing."
            exit 1
          fi

          echo "Version check passed: '${TAG_VERSION}' matches Cargo.toml."

      - name: Build Debian package
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          chmod +x ./packaging/build_deb.sh
          ./packaging/build_deb.sh "${TAG_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
