<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Plate -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)" stroke="#45475a" stroke-width="2"/>
  
  <!-- IC Pins (Top & Bottom) -->
  <g fill="#a6adc8">
    <rect x="34" y="14" width="6" height="10" rx="2"/>
    <rect x="48" y="14" width="6" height="10" rx="2"/>
    <rect x="61" y="14" width="6" height="10" rx="2"/>
    <rect x="74" y="14" width="6" height="10" rx="2"/>
    <rect x="88" y="14" width="6" height="10" rx="2"/>

    <rect x="34" y="104" width="6" height="10" rx="2"/>
    <rect x="48" y="104" width="6" height="10" rx="2"/>
    <rect x="61" y="104" width="6" height="10" rx="2"/>
    <rect x="74" y="104" width="6" height="10" rx="2"/>
    <rect x="88" y="104" width="6" height="10" rx="2"/>

    <!-- Left & Right Pins -->
    <rect x="14" y="34" width="10" height="6" rx="2"/>
    <rect x="14" y="48" width="10" height="6" rx="2"/>
    <rect x="14" y="61" width="10" height="6" rx="2"/>
    <rect x="14" y="74" width="10" height="6" rx="2"/>
    <rect x="14" y="88" width="10" height="6" rx="2"/>

    <rect x="104" y="34" width="10" height="6" rx="2"/>
    <rect x="104" y="48" width="10" height="6" rx="2"/>
    <rect x="104" y="61" width="10" height="6" rx="2"/>
    <rect x="104" y="74" width="10" height="6" rx="2"/>
    <rect x="104" y="88" width="10" height="6" rx="2"/>
  </g>

  <!-- Central Chip Body -->
  <rect x="24" y="24" width="80" height="80" rx="12" fill="url(#chip)" stroke="#585b70" stroke-width="2"/>

  <!-- Pin 1 Dot -->
  <circle cx="36" cy="36" r="4" fill="#89b4fa"/>

  <!-- Circuit Traces -->
  <path d="M 40 78 L 48 78 L 54 84 L 74 84 L 80 78 L 88 78" stroke="#89b4fa" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- StakHAL text -->
  <text x="64" y="60" fill="#cdd6f4" font-family="monospace, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1">[ HAL ]</text>
</svg>
